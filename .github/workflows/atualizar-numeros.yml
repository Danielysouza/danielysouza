name: Atualizar meus números

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia, 06:00 no horário de Brasília
  workflow_dispatch:       # permite rodar na mão pela aba Actions

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar rsvg e a fonte Poppins
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p ~/.fonts && cd ~/.fonts
          for f in Regular Medium SemiBold Bold; do
            curl -fsSL -O "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-$f.ttf"
          done
          fc-cache -f

      - name: Buscar números e gerar imagem
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/atualizar.py

      - name: Salvar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/numeros.svg assets/contribuicoes.svg
          git diff --cached --quiet || (git commit -m "atualiza números do perfil" && git push)
